name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io
  IMAGE_NAME: kamasalyamov/adhan
  CHART_REPO: qalby-tech/adhan-chart
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-chart:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout current repository code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Checkout chart repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHART_REPO }}
          token: ${{ secrets.CHART_REPO_TOKEN }}
          path: chart-repo

      - name: Update Chart.yaml
        id: update-chart
        working-directory: chart-repo
        run: |
          APP_VERSION="${{ steps.version.outputs.VERSION }}"
          CURRENT_APP_VERSION=$(grep '^appVersion:' Chart.yaml | sed 's/appVersion: "\(.*\)"/\1/')

          if [ "$APP_VERSION" == "$CURRENT_APP_VERSION" ]; then
            echo "App version unchanged. Skipping chart update."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          sed -i "s/appVersion:.*/appVersion: \"$APP_VERSION\"/" Chart.yaml

          echo "Updated appVersion in Chart.yaml:"
          cat Chart.yaml
          echo "updated_app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.update-chart.outputs.skip != 'true'
        working-directory: chart-repo
        run: |
          git config user.name "github-actions"
          git config user.email "kamasalyamov@gmail.com"
          git add Chart.yaml
          git commit -m "chore(chart): release app version ${{ steps.version.outputs.VERSION }}"
          git push origin main
